<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EU4 Knowledge Base Q&A</title>
<style>
  :root{ --bg:#f6f7f9; --card:#fff; --bd:#e3e6ea; --fg:#1f2430; --mut:#6b7280; --accent:#2563eb; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font-family:-apple-system,Segoe UI,system-ui,"Microsoft JhengHei","PingFang TC",sans-serif;line-height:1.65}
  .wrap{max-width:1100px;margin:0 auto;padding:22px 18px 60px}
  .topbar{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  h1{font-size:20px;margin:6px 0 14px} h1 .sub{font-size:13px;color:var(--mut);font-weight:normal;margin-left:6px}
  #lang{margin-left:auto;padding:5px 8px;border:1px solid var(--bd);border-radius:8px;background:var(--card);
        font:inherit;font-size:13px;color:var(--fg);cursor:pointer}
  .ask{display:flex;gap:8px;align-items:flex-end}
  textarea{flex:1;min-height:52px;max-height:200px;padding:10px 12px;border:1px solid var(--bd);
           border-radius:10px;font:inherit;resize:vertical;background:var(--card)}
  button{padding:11px 18px;border:0;border-radius:10px;background:var(--accent);color:#fff;font:inherit;
         font-weight:600;cursor:pointer;white-space:nowrap}
  button:disabled{opacity:.5;cursor:not-allowed}
  .hint{color:var(--mut);font-size:12px;margin:6px 2px}
  #status{margin:12px 2px 8px;color:var(--mut);font-size:13px;min-height:18px}
  .cols{display:grid;grid-template-columns:380px 1fr;gap:16px;margin-top:6px}
  @media(max-width:820px){.cols{grid-template-columns:1fr}}
  .cols>*{min-width:0}
  .panel{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px 16px}
  .panel h3{margin:0 0 10px;font-size:13px;color:var(--mut);font-weight:600;letter-spacing:.3px}
  #process{max-height:72vh;overflow:auto}
  /* process steps */
  .step{border-left:3px solid var(--bd);padding:6px 0 6px 10px;margin:8px 0;font-size:13px}
  .step .lbl{font-weight:600}
  .step.think{border-color:#a78bfa;color:#6d28d9}
  .step.text{border-color:#94a3b8;color:#334155}
  .step.tool{border-color:#2563eb}
  .step.res{border-color:#16a34a}
  .step code{background:#f0f3f7;padding:1px 5px;border-radius:4px;font-size:.88em;word-break:break-all}
  .step details{margin-top:4px} .step summary{cursor:pointer;color:var(--mut)}
  .step pre{white-space:pre-wrap;background:#f8fafc;border:1px solid var(--bd);border-radius:6px;
            padding:8px;margin:6px 0 0;max-height:240px;overflow:auto;font-size:12px}
  /* answer */
  .answer h1,.answer h2,.answer h3{margin:1em 0 .5em;line-height:1.3}
  .answer h2{font-size:18px;border-bottom:1px solid var(--bd);padding-bottom:4px} .answer h3{font-size:16px}
  .answer table{border-collapse:collapse;margin:10px 0;width:100%;font-size:14px}
  .answer th,.answer td{border:1px solid var(--bd);padding:6px 10px;text-align:left} .answer th{background:#f0f3f7}
  .answer code{background:#f0f3f7;padding:1px 5px;border-radius:4px;font-size:.9em}
  .answer pre{background:#0f172a;color:#e2e8f0;padding:12px;border-radius:8px;overflow:auto}
  .answer pre code{background:none;color:inherit}
  .answer blockquote{margin:.6em 0;padding:.2em 12px;border-left:3px solid var(--accent);background:#f8fafc}
  .answer:empty::before{content:attr(data-ph);color:var(--mut);font-size:13px}
  #fb{display:none;margin-top:14px;padding-top:12px;border-top:1px solid var(--bd);align-items:center;gap:8px;flex-wrap:wrap}
  #fb.show{display:flex}
  #fb .fbq{font-size:13px;color:var(--mut)}
  .fbbtn{padding:5px 12px;background:#fff;color:var(--fg);border:1px solid var(--bd);border-radius:8px;font-size:13px;font-weight:500}
  .fbbtn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
  .fbbtn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  #fbc{flex:1;min-width:160px;padding:6px 10px;border:1px solid var(--bd);border-radius:8px;font:inherit;font-size:13px}
  #fbmsg{font-size:13px;color:#16a34a}
  /* recorded demo runs (replay) */
  #demos{display:none;margin:14px 0 4px} #demos.show{display:block}
  #demos h3{margin:0 0 4px;font-size:13px;color:var(--mut);font-weight:600;letter-spacing:.3px}
  #demos .note{font-size:12px;color:var(--mut);margin:0 0 8px}
  .demolist{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scroll-snap-type:x proximity}
  .demo{flex:0 0 250px;scroll-snap-align:start;text-align:left;padding:9px 11px;background:var(--card);color:var(--fg);border:1px solid var(--bd);
        border-radius:10px;font-weight:500;font-size:13px;line-height:1.4;white-space:normal}
  .demo:hover:not(:disabled),.demo.on{border-color:var(--accent)} .demo.on{box-shadow:0 0 0 1px var(--accent) inset}
  .demo .shows{display:block;margin-top:4px;font-size:11.5px;color:var(--mut);font-weight:400}
  #replayq{display:none;margin:12px 2px 0;font-weight:600} #replayq.show{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
  #skip{padding:4px 10px;font-size:12px;background:#fff;color:var(--accent);border:1px solid var(--accent);border-radius:8px}
  .spin{display:inline-block;width:13px;height:13px;border:2px solid #cbd5e1;border-top-color:var(--accent);
        border-radius:50%;animation:r .8s linear infinite;vertical-align:-2px;margin-right:6px}
  @keyframes r{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <h1><span id="t-title">EU4 Knowledge Base Q&A</span> <span class="sub" id="t-sub">Local RAG · live process</span></h1>
    <select id="lang" title="Language">
      <option value="en">English</option>
      <option value="zh">中文</option>
    </select>
  </div>
  <div class="ask">
    <textarea id="q"></textarea>
    <button id="go">Send</button>
  </div>
  <div class="hint" id="t-hint"></div>
  <div id="demos"><h3 id="t-demos"></h3><p class="note" id="t-demonote"></p><div class="demolist" id="demolist"></div></div>
  <div id="replayq"><span id="rq"></span><button id="skip"></button></div>
  <div id="status"></div>
  <div class="cols">
    <div class="panel"><h3 id="t-proc"></h3><div id="process"></div></div>
    <div class="panel"><h3 id="t-ans"></h3><div id="answer" class="answer"></div>
      <div id="fb">
        <span class="fbq" id="t-fbq"></span>
        <button class="fbbtn" data-r="up"></button>
        <button class="fbbtn" data-r="down"></button>
        <input id="fbc" maxlength="500">
        <span id="fbmsg"></span>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
  // ---- i18n：所有 UI 文案集中在此。英文为默认(来源语言)，中文为附加。切换不写死在各处。----
  const I18N = {
    en: {
      title:"EU4 Knowledge Base Q&A", sub:"Local RAG · live process",
      placeholder:"Ask a question, e.g. What bonuses does the Aristocratic idea group give? (Ctrl/⌘+Enter to send)",
      send:"Send",
      hint:"Left: live view of the AI's thinking and which tools returned what. Right: the final answer (with «Document» citations).",
      proc:"🧭 Process (thinking / tools / results)", ans:"📝 Answer",
      answerPh:"The answer will appear here…",
      fbq:"Was this answer helpful?", fbUp:"👍 Helpful", fbDown:"👎 Not helpful", fbcPh:"Add a note (optional)",
      querying:"Querying… (first call or cold start may take 30–60s)",
      doneTools:(n,list)=>`✓ Done (used ${n} tools: ${list||"none"})`,
      doneSecs:(s)=>`✓ Done (${s}s)`,
      error:(e)=>`⚠ Error: ${e}`,
      connFail:(e)=>`⚠ Connection failed: ${e} (are backend 8781 and KB service 8766 both running?)`,
      start:"▶ Starting…", thinking:"Thinking", narrate:"Narration",
      internalLoad:"internal · loading tool", callTool:"Calling tool", params:"params",
      expand:"expand content", truncated:" (truncated)", noText:"(no text content for this step)",
      toolWord:"tool", returned:" returned",
      fbSaved:"✓ Recorded, thanks", fbFail:"⚠ Failed to record", fbFailE:(e)=>`⚠ Failed to record: ${e}`,
      demos:"▶ Recorded runs — click one to replay it", subReplay:"Replay of recorded runs · hybrid RAG + MCP agent",
      demoNoteLive:"Real runs of this system, recorded with every step. Replayed at higher speed.",
      demoNoteStatic:"This page has no live model behind it. Each run below was recorded end to end against the real system (reasoning, tool calls, raw tool results, final answer) and is replayed here at higher speed.",
      demoMeta:(n,s)=>`${n} tool calls · ${s}s live`,
      skip:"Skip to end ⏭", replaying:"Replaying recorded run…",
      replayDone:(n,s,m,d)=>`✓ Replay of a recorded run: ${n} tool calls, ${s}s live (${m}, recorded ${d})`,
    },
    zh: {
      title:"EU4 知识库问答", sub:"本地 RAG · 即时过程",
      placeholder:"输入问题，例如：贵族理念组有什么加成？（Ctrl/⌘+Enter 发送）",
      send:"发送",
      hint:"左侧即时显示 AI 的思考与用了哪些工具拿到什么；右侧是最终答案（附《文件名》出处）。",
      proc:"🧭 过程（思考 / 工具 / 结果）", ans:"📝 答案",
      answerPh:"答案会显示在这里…",
      fbq:"这个回答有帮助吗？", fbUp:"👍 有用", fbDown:"👎 没用", fbcPh:"补充说明（可选）",
      querying:"查询中…（首次或冷启动可能 30–60 秒）",
      doneTools:(n,list)=>`✓ 完成（用了 ${n} 次工具：${list||"无"}）`,
      doneSecs:(s)=>`✓ 完成（${s} 秒）`,
      error:(e)=>`⚠ 错误：${e}`,
      connFail:(e)=>`⚠ 连接失败：${e}（后端 8781 / KB 服务 8766 是否都在运行？）`,
      start:"▶ 开始处理…", thinking:"思考", narrate:"叙述",
      internalLoad:"内部·加载工具", callTool:"调用工具", params:"参数",
      expand:"展开内容", truncated:"（已截断）", noText:"（此步无文字内容）",
      toolWord:"工具", returned:" 返回",
      fbSaved:"✓ 已记录，谢谢", fbFail:"⚠ 记录失败", fbFailE:(e)=>`⚠ 记录失败：${e}`,
      demos:"▶ 录制的真实运行——点击回放", subReplay:"录制运行的回放 · 混合检索 RAG + MCP agent",
      demoNoteLive:"本系统的真实运行记录（含每一步），加速回放。",
      demoNoteStatic:"此页面后面没有在线模型。下面每一题都是对真实系统完整录制的运行（思考、工具调用、工具原始返回、最终答案），在此加速回放。",
      demoMeta:(n,s)=>`${n} 次工具调用 · 实际 ${s} 秒`,
      skip:"跳到结尾 ⏭", replaying:"回放录制的运行…",
      replayDone:(n,s,m,d)=>`✓ 录制运行的回放：${n} 次工具调用，实际耗时 ${s} 秒（${m}，录制于 ${d}）`,
    },
  };
  let LANG = (localStorage.getItem("eu4kb_lang") || "en");
  if (!I18N[LANG]) LANG = "en";
  const T = () => I18N[LANG];

  const $ = s => document.querySelector(s);
  function applyLang(){
    const d = T();
    document.documentElement.lang = (LANG === "zh" ? "zh-Hant" : "en");
    document.title = d.title;
    $('#t-title').textContent = d.title;
    $('#t-sub').textContent = d.sub;
    $('#q').placeholder = d.placeholder;
    $('#go').textContent = d.send;
    $('#t-hint').textContent = d.hint;
    $('#t-proc').textContent = d.proc;
    $('#t-ans').textContent = d.ans;
    $('#answer').setAttribute('data-ph', d.answerPh);
    $('#t-fbq').textContent = d.fbq;
    document.querySelector('.fbbtn[data-r="up"]').textContent = d.fbUp;
    document.querySelector('.fbbtn[data-r="down"]').textContent = d.fbDown;
    $('#fbc').placeholder = d.fbcPh;
    $('#lang').value = LANG;
    $('#t-demos').textContent = d.demos;
    $('#t-demonote').textContent = LIVE ? d.demoNoteLive : d.demoNoteStatic;
    $('#skip').textContent = d.skip;
    if (!LIVE && DEMOS.length) $('#t-sub').textContent = d.subReplay;
    renderDemos();
  }

  const el = (h)=>{ const div=document.createElement('div'); div.innerHTML=h; return div.firstElementChild; };
  function render(md){
    // CommonMark won't close **bold** after full-width punctuation when a CJK character follows
    // (e.g. **莫卧儿（Mughals）**流程), so convert bold up front
    const pre = md.replace(/\*\*(?=\S)([^*\n]+?)\*\*/g, '<strong>$1</strong>');
    if (window.marked){ try{ return marked.parse(pre); }catch(e){} }
    return '<pre style="white-space:pre-wrap;background:none;color:inherit;padding:0">'+md.replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</pre>';
  }
  function esc(s){ return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
  function addStep(cls, html){ const p=$('#process'); p.appendChild(el('<div class="step '+cls+'">'+html+'</div>')); p.scrollTop=p.scrollHeight; }

  let answerBuf=''; let turnId=null;
  function handle(ev){
    const d=T();
    if(ev.type==='start'){ if(ev.turn_id) turnId=ev.turn_id; addStep('text','<span class="lbl">'+esc(d.start)+'</span>'); }
    else if(ev.type==='thinking'){ if(ev.text&&ev.text.trim()) addStep('think','💭 <span class="lbl">'+esc(d.thinking)+'</span><br>'+esc(ev.text)); }
    else if(ev.type==='text'){ if(ev.text){ answerBuf+=ev.text; $('#answer').innerHTML=render(answerBuf);
                                            addStep('text','🗣 <span class="lbl">'+esc(d.narrate)+'</span>: '+esc(ev.text.slice(0,80))+(ev.text.length>80?'…':'')); } }
    else if(ev.type==='tool_use'){ const internal=(ev.name==='ToolSearch');
        const inp=esc(JSON.stringify(ev.input));
        addStep(internal?'text':'tool',
          (internal?'⚙ <span class="lbl">'+esc(d.internalLoad)+'</span> ':'🔧 <span class="lbl">'+esc(d.callTool)+'</span> ')+
          '<code>'+esc(ev.name)+'</code>'+(internal?'':'<br>'+esc(d.params)+' <code>'+inp+'</code>')); }
    else if(ev.type==='tool_result'){ const c=(ev.content||'').trim();
        const internal=(ev.name==='ToolSearch');
        const body = c ? '<details'+(internal?'':' open')+'><summary>'+esc(d.expand)+(ev.truncated?esc(d.truncated):'')+'</summary><pre>'+esc(ev.content)+'</pre></details>'
                       : '<span style="color:var(--mut)">'+esc(d.noText)+'</span>';
        addStep(internal?'text':'res',
          (internal?'⚙':'📄')+' <span class="lbl">'+esc(ev.name||d.toolWord)+esc(d.returned)+'</span> '+body); }
    else if(ev.type==='final'){ if(ev.answer){ answerBuf=ev.answer; $('#answer').innerHTML=render(answerBuf); }
        if(ev.turn_id) turnId=ev.turn_id;
        const tu=(ev.tools_used||[]).map(t=>t.replace('mcp__eu4-kb__',''));
        $('#status').textContent=d.doneTools(tu.length, tu.join(', '));
        if(ev.answer && turnId) $('#fb').classList.add('show'); }
    else if(ev.type==='error'){ $('#status').textContent=d.error(ev.error); addStep('text','⚠ '+esc(ev.error)); }
  }

  async function ask(){
    const q=$('#q').value.trim(); if(!q) return;
    const d=T();
    $('#go').disabled=true; $('#process').innerHTML=''; $('#answer').innerHTML=''; answerBuf=''; turnId=null; resetFeedback();
    $('#status').innerHTML='<span class="spin"></span>'+esc(d.querying);
    const t0=Date.now();
    try{
      const resp=await fetch('ask_stream',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q, lang:LANG})});
      if(!resp.ok||!resp.body){ throw new Error('HTTP '+resp.status); }
      const reader=resp.body.getReader(); const dec=new TextDecoder(); let buf='';
      while(true){
        const {done,value}=await reader.read(); if(done) break;
        buf+=dec.decode(value,{stream:true}); let i;
        while((i=buf.indexOf('\n'))>=0){ const line=buf.slice(0,i).trim(); buf=buf.slice(i+1);
          if(line){ try{ handle(JSON.parse(line)); }catch(e){} } }
      }
      if(!$('#status').textContent.startsWith('✓')&&!$('#status').textContent.startsWith('⚠'))
        $('#status').textContent=d.doneSecs(((Date.now()-t0)/1000).toFixed(0));
    }catch(e){ $('#status').textContent=d.connFail(e); }
    $('#go').disabled=false;
  }
  function resetFeedback(){ $('#fb').classList.remove('show'); $('#fbc').value=''; $('#fbc').disabled=false; $('#fbmsg').textContent='';
    document.querySelectorAll('.fbbtn').forEach(b=>{ b.disabled=false; b.classList.remove('on'); }); }
  async function sendFeedback(rating, btn){
    if(!turnId) return;
    const d=T();
    document.querySelectorAll('.fbbtn').forEach(b=>b.disabled=true); btn.classList.add('on'); $('#fbc').disabled=true;
    try{
      const r=await fetch('feedback',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({turn_id:turnId, rating, comment:$('#fbc').value.trim()})});
      $('#fbmsg').textContent = r.ok ? d.fbSaved : d.fbFail;
    }catch(e){ $('#fbmsg').textContent=d.fbFailE(e);
      document.querySelectorAll('.fbbtn').forEach(b=>b.disabled=false); $('#fbc').disabled=false; btn.classList.remove('on'); }
  }
  // ---- Replay of recorded runs (demo/index.json + demo/traces/<id>.json, written by record_demo.py).
  // With no backend behind the page (static hosting), replay is the only mode and the ask box is hidden.
  let LIVE = false, DEMOS = [], replayGen = 0, skipNow = false;
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  function renderDemos(){
    const list = $('#demolist'); list.innerHTML = '';
    DEMOS.forEach(x=>{
      const b = el('<button class="demo" data-id="'+esc(x.id)+'">'+esc(x.question)+
                   '<span class="shows">'+esc(x.shows)+' · '+esc(T().demoMeta(x.tool_calls, Math.round(x.duration_ms/1000)))+'</span></button>');
      b.onclick = ()=>replay(x.id);
      list.appendChild(b);
    });
    $('#demos').classList.toggle('show', DEMOS.length>0);
  }
  async function replay(id){
    const gen = ++replayGen; skipNow = false;
    document.querySelectorAll('.demo').forEach(b=>{ b.classList.toggle('on', b.dataset.id===id);
      if (b.dataset.id===id) b.scrollIntoView({block:'nearest', inline:'nearest'}); });
    const tr = await (await fetch('demo/traces/'+encodeURIComponent(id)+'.json')).json();
    if (gen !== replayGen) return;
    const d = T();
    $('#process').innerHTML=''; $('#answer').innerHTML=''; answerBuf=''; turnId=null; resetFeedback();
    $('#rq').textContent = 'Q: ' + tr.question; $('#replayq').classList.add('show'); $('#skip').style.display='';
    $('#status').innerHTML = '<span class="spin"></span>' + esc(d.replaying);
    let prev = 0;
    for (const ev of tr.events){
      // compress real time: long gaps (model thinking, slow tools) shrink, but order and rhythm stay visible
      if (!skipNow) await sleep(Math.min(Math.max((ev.t - prev) / 2.5, 250), 2500));
      if (gen !== replayGen) return;
      prev = ev.t; handle(ev);
    }
    $('#skip').style.display='none';
    $('#status').textContent = d.replayDone(tr.tool_calls, Math.round(tr.duration_ms/1000), tr.model, tr.recorded_at);
    $('#fb').classList.remove('show');
  }
  async function init(){
    try{ const r = await fetch('health'); LIVE = r.ok && (await r.json()).status === 'ok'; }catch(e){ LIVE = false; }
    try{ const r = await fetch('demo/index.json'); if (r.ok) DEMOS = await r.json(); }catch(e){ DEMOS = []; }
    if (!LIVE){ $('.ask').style.display='none'; $('#t-hint').style.display='none'; }
    applyLang();
    const want = new URLSearchParams(location.search).get('demo');
    if (!LIVE && DEMOS.length) replay(want && DEMOS.some(x=>x.id===want) ? want : DEMOS[0].id);
  }

  document.querySelectorAll('.fbbtn').forEach(b=> b.onclick=()=>sendFeedback(b.dataset.r, b));
  $('#go').onclick=()=>{ replayGen++; $('#replayq').classList.remove('show'); document.querySelectorAll('.demo').forEach(b=>b.classList.remove('on')); ask(); };
  $('#skip').onclick=()=>{ skipNow = true; };
  $('#q').addEventListener('keydown',e=>{ if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)) $('#go').onclick(); });
  $('#lang').addEventListener('change', e=>{ LANG = e.target.value; localStorage.setItem("eu4kb_lang", LANG); applyLang(); });
  applyLang();
  init();
</script>
</body>
</html>
